<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игра на память</title>
    <style>
        /* --- СБРОС СТИЛЕЙ И ШРИФТЫ --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0b1a; /* Темный фон как на скрине */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- ОСНОВНОЙ КОНТЕЙНЕР --- */
        .app-container {
            width: 100%;
            max-width: 430px; /* Ширина iPhone Pro Max */
            height: 100vh;
            max-height: 932px;
            background-color: #110f22;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- ШАПКА (HEADER) --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }

        .icon-btn:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.95);
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            gap: 10px;
        }

        /* --- ЗАГОЛОВКИ --- */
        .title-section {
            margin-bottom: 20px;
        }

        .title-section h1 {
            font-size: 26px;
            font-weight: 700;
            color: #a78bfa; /* Светло-фиолетовый */
            margin-bottom: 5px;
        }

        .title-section p {
            font-size: 14px;
            color: #9ca3af;
        }

        /* --- ПАНЕЛЬ СТАТИСТИКИ --- */
        .stats-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #9ca3af;
        }

        /* --- ИГРОВОЕ ПОЛЕ --- */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            flex-grow: 1;
            margin-bottom: 20px;
            perspective: 1000px;
        }

        .card {
            background: transparent;
            cursor: pointer;
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            pointer-events: none;
            animation: matchPulse 0.5s ease;
        }

        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.05); box-shadow: 0 0 20px #a78bfa; }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
        }

        /* Лицевая сторона (рубашка) */
        .card-front {
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        /* Обратная сторона (изображение) */
        .card-back {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transform: rotateY(180deg);
            font-size: 36px;
        }

        /* --- КНОПКА ПЕРЕЗАПУСКА --- */
        .reset-btn {
            background: linear-gradient(90deg, #5b21b6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .reset-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

    </style>
</head>
<body>

<div class="app-container">
    <!-- Шапка -->
    <div class="header">
        <button class="icon-btn" title="Закрыть">✕</button>
        <div class="header-title">Игра на память</div>
        <div class="header-right">
            <button class="icon-btn" title="Настройки">🎧</button>
            <button class="icon-btn" title="Поделиться">↑</button>
        </div>
    </div>

    <!-- Заголовки -->
    <div class="title-section">
        <h1>Тренируем память</h1>
        <p>Открывайте по две карточки и находите пары.</p>
    </div>

    <!-- Статистика -->
    <div class="stats-panel">
        <div class="stat-box">
            <div class="stat-value" id="moves-count">0</div>
            <div class="stat-label">ходов</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="pairs-found">0/8</div>
            <div class="stat-label">пар найдено</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="timer">0:00</div>
            <div class="stat-label">время</div>
        </div>
    </div>

    <!-- Игровое поле -->
    <div class="game-board" id="game-board">
        <!-- Карточки будут сгенерированы через JS -->
    </div>

    <!-- Кнопка -->
    <button class="reset-btn" id="reset-btn">Начать заново</button>
</div>

<script>
    // --- ЛОГИКА ИГРЫ ---
    
    // Набор эмодзи для карточек
    const ICONS = ['🚀', '🎨', '🎧', '💡', '🔥', '⭐', '🍕', '🎮'];
    
    // Состояние игры
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let isLocked = false;
    let timerInterval = null;
    let secondsElapsed = 0;
    let hasStarted = false;

    // DOM элементы
    const board = document.getElementById('game-board');
    const movesEl = document.getElementById('moves-count');
    const pairsEl = document.getElementById('pairs-found');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset-btn');

    // Инициализация игры
    function initGame() {
        // Сброс переменных
        board.innerHTML = '';
        flippedCards = [];
        matchedPairs = 0;
        moves = 0;
        secondsElapsed = 0;
        isLocked = false;
        hasStarted = false;
        clearInterval(timerInterval);
        
        updateStats();
        timerEl.innerText = '0:00';

        // Создаем массив карточек (дублируем и перемешиваем)
        cards = [...ICONS, ...ICONS].sort(() => Math.random() - 0.5);

        // Генерируем HTML
        cards.forEach((icon, index) => {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card');
            cardElement.dataset.icon = icon;
            cardElement.dataset.index = index;

            cardElement.innerHTML = `
                <div class="card-face card-front">?</div>
                <div class="card-face card-back">${icon}</div>
            `;

            cardElement.addEventListener('click', () => flipCard(cardElement));
            board.appendChild(cardElement);
        });
    }

    // Переворот карточки
    function flipCard(card) {
        if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) {
            return;
        }

        // Запуск таймера при первом ходе
        if (!hasStarted) {
            startTimer();
            hasStarted = true;
        }

        card.classList.add('flipped');
        flippedCards.push(card);

        if (flippedCards.length === 2) {
            checkMatch();
        }
    }

    // Проверка совпадения
    function checkMatch() {
        moves++;
        updateStats();
        
        const [card1, card2] = flippedCards;
        const isMatch = card1.dataset.icon === card2.dataset.icon;

        if (isMatch) {
            // Совпадение
            setTimeout(() => {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                updateStats();
                
                // Проверка победы
                if (matchedPairs === ICONS.length) {
                    clearInterval(timerInterval);
                    setTimeout(() => alert(`Поздравляем! Вы выиграли за ${moves} ходов и ${timerEl.innerText} времени!`), 500);
                }
                flippedCards = [];
                isLocked = false;
            }, 500);
        } else {
            // Не совпали
            isLocked = true;
            setTimeout(() => {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                flippedCards = [];
                isLocked = false;
            }, 1000);
        }
    }

    // Обновление статистики
    function updateStats() {
        movesEl.innerText = moves;
        pairsEl.innerText = `${matchedPairs}/${ICONS.length}`;
    }

    // Таймер
    function startTimer() {
        timerInterval = setInterval(() => {
            secondsElapsed++;
            const minutes = Math.floor(secondsElapsed / 60);
            const seconds = secondsElapsed % 60;
            timerEl.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }, 1000);
    }

    // Слушатели событий
    resetBtn.addEventListener('click', initGame);

    // Запуск игры при загрузке
    initGame();

</script>
</body>
</html>
